<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- AUTONOMOUS: iPad/iOS — disable browser pinch-zoom and double-tap
         zoom so the canvas owns all gesture input. Without
         user-scalable=no + maximum-scale=1, iOS Safari hijacks
         two-finger pinch and double-tap, which made the whiteboard
         drawing surface unusable on iPad. The canvas has its own
         pan/zoom gestures (wheel/trackpad) — we don't want the page
         to zoom underneath them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Live interactive maths classroom — upload HTML simulations and collaborate with students in real-time." />
    <meta name="theme-color" content="#FAFBFC" />
    <title>MathsLive — Interactive Teaching Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
