services:
  - type: web
    name: math-live
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    # /healthz is the purpose-built cheap probe (tiny JSON, no SPA fallback,
    # no static-file work) — exactly what a health checker should hit.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # ── THE reason this service kept dying ──
      # Node sizes its heap from the MACHINE's memory, not the container's
      # cgroup limit. On this 512MB instance V8 reported a 4288MB ceiling and
      # grew happily past 512MB, at which point the container killed it. It
      # never had a reason to collect aggressively, so no amount of
      # application-level cleanup could get there first. Every "Ran out of
      # memory (used over 512MB)" restart traces to this, and those restarts
      # are what burned the monthly quota and suspended the account.
      #
      # 256MB of old-space reports a ~448MB total heap ceiling, leaving room in
      # the container for code, buffers, stack and native allocations. Raise
      # NODE_HEAP_MB on a bigger instance (and MEMORY_BUDGET_MB with it).
      - key: NODE_HEAP_MB
        value: "256"
      # ── Site access code ──
      # One code everyone must present — tutor and student — before the server
      # will do anything. Set the VALUE IN THE DASHBOARD, not here: a passcode
      # committed to the repository is a passcode published to everyone who can
      # read the repository. Leave it unset to turn the gate off.
      # sync:false = "I set this in the dashboard; don't manage it from git."
      - key: SITE_PASSCODE
        sync: false
      # ── Free-tier hours ──
      # The keep-warm self-ping stops the instance sleeping, which costs ~730
      # of the 750 free hours a month for ONE service — the reason this account
      # hit its quota. Set KEEP_WARM=off to let it sleep between lessons
      # (~120 hrs/mo for a few hours of teaching a day). The trade is a 20-60s
      # cold start for whoever arrives first. Set the Upstash variables above
      # BEFORE turning this off, or sleeping wipes live rooms.
      - key: KEEP_WARM
        value: "on"
      # ── Durable rooms across ANY restart (redeploy / crash), not just idle ──
      # Keep-warm stops idle sleep; THESE make a class survive a real restart.
      # Create a free Upstash Redis DB at https://upstash.com (Redis → Create),
      # then paste its "UPSTASH_REDIS_REST_URL" and "UPSTASH_REDIS_REST_TOKEN"
      # into these fields in the Render dashboard (service → Environment).
      # Left blank, the server safely falls back to in-memory rooms.
      # sync:false = "I'll set the value in the dashboard; don't manage from git."
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
    autoDeploy: true
    # Free plan rooms are otherwise in-memory only and reset on cold-start.
    # (Paid-plan alternative to Redis: a persistent disk mounted at
    #  /opt/render/project/src/.rooms — see Render docs.)
